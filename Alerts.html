<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/alerts.css" />
    <scriptsrc="https://unpkg.com/@streamerbot/client/dist/streamerbot-client.js"
    ></scriptsrc=>
    <script src="scripts/config.js"></script>
    <script src="scripts/main.js"></script>
    <title>Streamer.bot websocket alerts</title>
  </head>
  <body>
    <div id="alertContainer"></div>

    <audio id="sound"></audio>

    <template id="twitchAlertTemplate">
      <div class="alert twitch-alert bounce-in">
        <div id="alertImageWrapper">
          <video
            width="854"
            height="480"
            autoplay
            loop
            muted
            id="alertImage"
            class="bounce-in-img"
          >
            <source src="" id="alertImage" class="bounce-in-img" />
          </video>
        </div>
        <div id="details">
          <div>
            <h1 id="username"></h1>
            <h2 id="title"></h2>
          </div>
          <h3 id="message"></h3>
        </div>
      </div>
    </template>
    <!-- <template id="twitchAlertTemplate">
      <div class="alert twitch-alert bounce-in">
        <div id="alertImageWrapper">
          <img src="" id="alertImage" class="bounce-in-img" />
        </div>
        <div id="details">
          <h1 id="title"></h1>
          <h2 id="message"></h2>
        </div>
      </div>
    </template> -->

    <template id="kofiAlertTemplate">
      <div class="alert kofi-alert bounce-in">
        <div id="alertImageWrapper">
          <img src="" id="alertImage" class="bounce-in-img" />
        </div>
        <div id="details">
          <h1 id="title"></h1>
          <h2 id="message"></h2>
        </div>
      </div>
    </template>

    <script>
      if (useCSSVariables) {
        setCSSVars();
      }

      attachListeners();
    </script>
  </body>
</html>
